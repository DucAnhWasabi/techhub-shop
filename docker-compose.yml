x-backend-common: &backend-common
  build: .
  command: ["npm", "run", "start:api"]
  environment:
    NODE_ENV: production
    PORT: 3000
    DATABASE_URL: postgres://${POSTGRES_USER:-techhub}:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/${POSTGRES_DB:-techhub}
    REDIS_URL: redis://redis:6379
    ELASTICSEARCH_URL: http://elasticsearch:9200
    SESSION_SECRET: ${SESSION_SECRET:-local-development-session-secret-change-me}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    BASE_URL: ${BASE_URL:-http://localhost:8080}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
    FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-TechHub <no-reply@techhub.local>}
    ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@techhub.local}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!ChangeMe}
  expose:
    - "3000"
  depends_on:
    seed:
      condition: service_completed_successfully
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    elasticsearch:
      condition: service_started
  restart: unless-stopped

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend-1:
        condition: service_started
      backend-2:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: .
    command: ["npm", "run", "start:web"]
    environment:
      WEB_PORT: 3001
      API_INTERNAL_URL: http://backend-1:3000
    expose:
      - "3001"
    restart: unless-stopped

  backend-1:
    <<: *backend-common
    hostname: techhub-api-1

  backend-2:
    <<: *backend-common
    hostname: techhub-api-2

  seed:
    build: .
    command: ["npm", "run", "seed"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-techhub}:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/${POSTGRES_DB:-techhub}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@techhub.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!ChangeMe}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  migrate:
    build: .
    command: ["node", "scripts/migrate.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-techhub}:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/${POSTGRES_DB:-techhub}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techhub}
      POSTGRES_USER: ${POSTGRES_USER:-techhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.7
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    expose:
      - "9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
