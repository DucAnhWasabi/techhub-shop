upstream shop_frontend {
    zone shop_frontend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server frontend:3001 resolve;
}

# Nginx 1.27.3+ resolves Docker service addresses dynamically and balances replicas.
upstream shop_backend {
    zone shop_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server backend:3000 resolve;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://shop_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://shop_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://shop_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
